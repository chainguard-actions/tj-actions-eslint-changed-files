name: Test ESLint no changed files (skip linting)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ESLint action with all_files=false (no changed files scenario)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          all_files: 'false'
          skip_annotations: 'true'
          path: '.'

      - name: Assert action ran (changed-files detection or graceful skip)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under the harness (workflow_dispatch), tj-actions/changed-files may:
          # - succeed with no changed files -> entrypoint skips linting (success)
          # - fail due to sentinel repo not being resolvable (failure)
          # Both outcomes are acceptable for this test.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed - no files to lint, skipped gracefully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for changed-files detection)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
