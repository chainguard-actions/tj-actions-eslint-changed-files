name: Test ESLint invalid path error handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run ESLint action with invalid path
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          all_files: 'true'
          skip_annotations: 'true'
          path: 'nonexistent-directory-that-does-not-exist'

      - name: Assert action failed with invalid path error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid path"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid path"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
